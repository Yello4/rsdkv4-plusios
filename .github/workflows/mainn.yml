name: Build RSDKv4+ iOS
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare iOS Build & Headers
        run: |
          mkdir -p dependencies/ios/OpenGL
          touch dependencies/ios/Data.rsdk
          cat << 'EOF' > dependencies/ios/OpenGL/gl.h
          #pragma once
          #include <OpenGLES/ES2/gl.h>
          typedef double GLdouble;
          EOF
          cat << 'EOF' > dependencies/ios/OpenGL/glext.h
          #pragma once
          #include <OpenGLES/ES2/glext.h>
          EOF

      - name: Build Xcode Project
        run: |
          set -o pipefail
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            HEADER_SEARCH_PATHS="\$(inherited) \$(PROJECT_DIR)/dependencies/ios" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|FAILED|succeeded" -C 2

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r RSDKv4Plus.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4Plus-iOS
          path: RSDKv4Plus.ipa
