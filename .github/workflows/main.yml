name: Build RSDKv4+ iOS
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect Project & Dependencies
        run: |
          ls -la
          xcodebuild -list -project "RSDKv4 ios.xcodeproj" || true

      - name: Build Xcode Project
        run: |
          SCHEME=$(xcodebuild -list -project "RSDKv4 ios.xcodeproj" | awk '/Schemes:/{getline; gsub(/^[ \t]+/, ""); print; exit}')
          echo "Detected scheme: $SCHEME"
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r RSDKv4Plus.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4Plus-iOS
          path: RSDKv4Plus.ipa
